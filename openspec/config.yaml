schema: spec-driven

context: |
  OpenDayCare es una aplicación web multi-tenant para guarderías.
  El personal (staff) publica en un feed lo que ocurre en su sala: actividades,
  comidas, siestas, ánimo y fotos. Los padres acceden por invitación y ven
  únicamente las publicaciones y perfiles de sus propios hijos.

  Dominio: guarderías (daycares), salas (rooms), niños (children), usuarios
  staff y padres, invitaciones y vínculos padre-hijo, publicaciones y fotos.

  Stack: Next.js 16 App Router, TypeScript estricto, Tailwind CSS v4,
  Supabase (Auth + Postgres con RLS en todas las tablas) vía @supabase/ssr.

  Convenciones: identificadores, enums y valores persistidos en inglés;
  etiquetas de UI y especificaciones en español. Claves primarias UUID y
  campos de auditoría timestamptz.

